name: publish image

# Builds both images and publishes them to GitHub Packages (ghcr.io), where they
# appear at https://github.com/notbobutah?tab=packages:
#
#   .../lumid  — the Go backend, corpus baked in (context: repository root)
#   .../web    — the Next.js client (context: web/)
#
# They are separate jobs rather than sequential steps so a Go change and a
# client change do not wait on each other, and so a failure names which half
# broke without reading the log.
#
# Pull requests build but do NOT push — a fork's token cannot write packages, and
# an unreviewed branch should not publish a tag someone might pull.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: lumid (Go backend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the built-in GITHUB_TOKEN push to ghcr.io. No PAT to create or rotate.
      packages: write
      # Required by the build provenance attestation below.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      # ghcr.io rejects any uppercase character in an image name, and this
      # repository is `notbobutah/GoReactChat` — so ${{ github.repository }}
      # cannot be used directly. Lowercasing it here keeps the name derived from
      # the repo (no hardcoded owner to update on a fork or rename).
      - name: Compute image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}/lumid" >> "$GITHUB_OUTPUT"

      # Compile and vet before building an image — a broken binary should fail
      # here, not on a pull.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build, vet and test
        working-directory: server
        run: |
          go build ./...
          go vet ./...
          go test ./...

      # buildx for multi-platform output and the GitHub Actions layer cache.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          # Links the package to this repository on the packages page, which is
          # also what lets the package inherit the repo's visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=lumi-go chat backend (gRPC / Connect)

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          # The repository root: the image ships `data/` alongside the binary,
          # so the corpus has to be inside the build context. `.dockerignore`
          # keeps web/ and its node_modules out.
          context: .
          file: server/Dockerfile
          # Go cross-compiles, so arm64 costs a second compile rather than a
          # QEMU-emulated build (see --platform=$BUILDPLATFORM in the Dockerfile).
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed statement of what built this image, verifiable with
      # `gh attestation verify oci://<image> --repo <owner>/<repo>`.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Packages: https://github.com/${{ github.repository_owner }}?tab=packages"
            echo
            echo "> The first publish creates the package **private**. Make it public under"
            echo "> Package settings if it should be pullable anonymously."
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web (Next.js client)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      # Same lowercasing as the backend job: ghcr.io rejects uppercase in an
      # image name and this repository is `notbobutah/GoReactChat`.
      - name: Compute image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"

      # Lint and type-check before building. `next build` would catch a type
      # error too, but ten minutes into a multi-arch image build rather than
      # thirty seconds in.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, lint and type-check
        working-directory: web
        run: |
          npm ci
          # Next generates the route/layout types (LayoutProps and friends) into
          # next-env.d.ts and .next/types. Both are gitignored build output, so
          # a fresh checkout has neither and tsc fails on types it cannot see.
          # `typegen` writes them without paying for a full build.
          npx next typegen
          npx tsc --noEmit
          npm run lint

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=lumi-go chat web client (Next.js)

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          # amd64 only. Unlike Go, a Next.js build under QEMU is emulated and
          # slow, and the cluster is amd64 — a second architecture would cost
          # real minutes on every push to buy nothing.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
