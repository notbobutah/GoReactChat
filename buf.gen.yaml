version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/expona-ai/lumi-go/server/gen
plugins:
  # Go message types + Connect handlers/clients for the backend.
  - local: protoc-gen-go
    out: server/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: server/gen
    opt: paths=source_relative
  # TypeScript for the Next.js client. Connect-ES v2 consumes protobuf-es
  # output directly, so no separate connect generator is needed.
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt:
      - target=ts
      - import_extension=js
