# TEMPLATE. Do not apply this file and do not fill it in here — it is committed,
# and a public repository is the one place these two values must never appear.
#
# Create the real Secret imperatively instead, so the values pass through your
# shell and the cluster and nowhere else:
#
#   kubectl -n dev-next create secret generic lumi-go-secrets \
#     --from-literal=DATABASE_URL="$DATABASE_URL" \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
#
# To rotate a value, delete and recreate the secret, then restart the rollout:
#
#   kubectl -n dev-next delete secret lumi-go-secrets
#   kubectl -n dev-next create secret generic lumi-go-secrets ...
#   kubectl -n dev-next rollout restart deployment/lumi-go-api
#
# A pod reads its environment once at start, so the restart is not optional —
# without it the old credential stays live in the running process.
apiVersion: v1
kind: Secret
metadata:
  name: lumi-go-secrets
  namespace: dev-next
  labels:
    app.kubernetes.io/part-of: lumi-go
type: Opaque
stringData:
  # Neon Postgres, including ?sslmode=require. Quote it: the connection string
  # contains `&`, which an unquoted shell reads as a background operator.
  DATABASE_URL: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
